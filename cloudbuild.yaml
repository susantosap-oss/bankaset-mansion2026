steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - asia-southeast2-docker.pkg.dev/$PROJECT_ID/bankaset/app:$COMMIT_SHA
      - -t
      - asia-southeast2-docker.pkg.dev/$PROJECT_ID/bankaset/app:latest
      - .

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - --all-tags
      - asia-southeast2-docker.pkg.dev/$PROJECT_ID/bankaset/app

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - bankaset-mansion2026
      - --image=asia-southeast2-docker.pkg.dev/$PROJECT_ID/bankaset/app:$COMMIT_SHA
      - --region=asia-southeast2
      - --platform=managed
      - --allow-unauthenticated
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --set-secrets=AUTH_SECRET=AUTH_SECRET:latest,GROQ_API_KEY=GROQ_API_KEY:latest,SERPER_API_KEY=SERPER_API_KEY:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,GOOGLE_SHEET_ID=GOOGLE_SHEET_ID:latest,CRM_SHEET_ID=CRM_SHEET_ID:latest,GOOGLE_IMPERSONATE_SA=GOOGLE_IMPERSONATE_SA:latest

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: asia-southeast2
